<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        .container{
            background-color: rgb(20, 20, 20);
            height: 38vh;
            width: 20vw;
            margin: auto;
            position: relative;
            margin-top: 20%;
        }
        .card{
            background-color: rgb(20, 17, 17);
            height: 38vh;
            width: 10vw;
            color: red;
            text-align: center;
            position: absolute;
            left: 24%;
        }
        .line{
            height: 3px;
            background-color: blue;
            border: none;
        }
        span{
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
        <span>TEN</span>
        <div class="line"></div>
        <span>NINE</span>
        <div class="line"></div>
        <span>EIGHT</span>
        <div class="line"></div>
        <span>SEVEN</span>
        <div class="line"></div>
        <span>SIX</span>
        <div class="line"></div>
        <span>FIVE</span>
        <div class="line"></div>
        <span>FOUR</span>
        <div class="line"></div>
        <span>THREE</span>
        <div class="line"></div>
        <span>TWO</span>
        <div class="line"></div>
        <span>ONE</span>
    </div>
</body>
</html>
