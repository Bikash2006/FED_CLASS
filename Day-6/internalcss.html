<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        h1{
            background-color: antiquewhite;
            color:rgb(118, 118, 21);
        }
        h1, p{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .container{
            width: 200px;
            height: 200px;
            background-color: aqua;
        }
        .child{
            width: 20px;
            height: 20px;
            background-color: red;
            margin: 20px;
        }
        #text{
            background-color: blueviolet;
            color:white;
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <p>This is another paragraph describing the heading</p>
    <div class="container">
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
    </div>
    <div class="parent"></div><br>
    <span id="text">CSIT</span>
</body>
</html>
