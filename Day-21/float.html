<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 2px solid black;
        }
        .left{
            width: 150px;
            float: left;
        }
        .right{
            width: 150px;
            float: right;
        }
        p{
            clear: both;
        }
    </style>
</head>
<body>
    <div>
        <img class="left" src="./Aadim's Logo.jpg" alt="">
        <img class="right" src="./Aadim's Logo.jpg" alt="">
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Eveniet numquam eius, delectus deleniti repudiandae, laboriosam libero necessitatibus, labore ducimus dicta asperiores molestias eligendi quidem. Est quam vel fugiat sint soluta?</p>
        
    </div>
</body>
</html>
