<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            position: relative;
            background-color: bisque;
            height: 100vh;
            width: 80vw;
            margin: auto;
            text-align: center;
        }
        .card1{
            height: 100px;
            width: 100px;
            background-color: blue;
            color: white;
            position: absolute;
            top: 50%;
            left: 45%;

        }
        .card2{
            height: 100px;
            width: 100px;
            background-color: Brown;
            color: white;
            position: absolute;
            right: 0;
        }
        .card3{
            height: 100px;
            width: 100px;
            background-color: Red;
            color: white;
            position: absolute;
        }
        .card4{
            height: 100px;
            width: 100px;
            background-color: Black;
            color: white;
            position: absolute;
            left: 0;
            bottom: 0;
            }
        .card5{
            height: 100px;
            width: 100px;
            background-color: yellow;
            color: red;
            position: absolute;
            right: 0;
            bottom: 0;

        }
    </style>
</head>
<body>
    <div class="main">
        <div class="card1">Blue</div>
        <div class="card2">Brown</div>
        <div class="card3">Red</div>
        <div class="card4">Black</div>
        <div class="card5">Yellow</div>
        </div>
</body>
</html>
