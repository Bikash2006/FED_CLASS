<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
     <style>
        table{
            border: 2px solid black;
            margin: auto;
            border-collapse: collapse;
        }
        tr, th, td{
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td rowspan="3">Row 1,2,3</td>
            <td colspan="2">Column 1 &2</td>
        </tr>
        <tr>
            <td rowspan="2">Item A</td>
            <td rowspan="2">Item B</td>
        </tr>
    </table>
    
</body>
</html>
