<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            width: 400px;
            height: 300px;
            border: 2px solid black;
            margin: 0 auto;
            position: relative;
        }
        .child{
            width: 80px;
            height: 80px;
            border: 2px solid red;
            position: absolute;
            left: 200px;
            top: 50px;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">

        </div>
    </div>
</body>
</html>
